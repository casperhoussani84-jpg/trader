<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hero-rotation"
        class="scene"
        data-composition-id="01-hero-rotation"
        data-composition-src="compositions/frames/01-hero-rotation.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-locks-close"
        class="scene"
        data-composition-id="02-locks-close"
        data-composition-src="compositions/frames/02-locks-close.html"
        data-start="5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-fresh-lunch"
        class="scene"
        data-composition-id="03-fresh-lunch"
        data-composition-src="compositions/frames/03-fresh-lunch.html"
        data-start="9"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-perfect-close"
        class="scene"
        data-composition-id="04-perfect-close"
        data-composition-src="compositions/frames/04-perfect-close.html"
        data-start="14"
        data-duration="3.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-brand-outro"
        class="scene"
        data-composition-id="05-brand-outro"
        data-composition-src="compositions/frames/05-brand-outro.html"
        data-start="17"
        data-duration="3"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hero-rotation", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-locks-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-locks-close", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-fresh-lunch", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.to("#el-03-fresh-lunch", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 14);
        tl.fromTo("#el-04-perfect-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 14);
        tl.to("#el-04-perfect-close", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-05-brand-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
