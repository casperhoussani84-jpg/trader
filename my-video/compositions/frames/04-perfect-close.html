<template data-composition-id="04-perfect-close">
<div id="root" data-composition-id="04-perfect-close" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <style>
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      container-type: size;
    }

    #root .clip {
      position: absolute;
      inset: 0;
    }

    /* full-bleed studio-white ground, painted on a clip layer (never on #root) */
    #pc04-ground {
      background: #ffffff;
    }

    /* faint compass ring — atmosphere behind the product */
    #pc04-ring-layer {
      pointer-events: none;
    }
    #pc04-ring {
      position: absolute;
      left: 50%;
      top: 700px;
      width: 780px;
      height: 780px;
      margin: -390px 0 0 -390px;
      border-radius: 50%;
      border: 1px solid #C9A227;
      opacity: 0;
    }
    #pc04-ring::before {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: 50%;
      border: 1px dashed #C9A227;
      opacity: 0.7;
    }

    /* hero stage: glow behind, product in front */
    #pc04-stage {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #pc04-bloom-glow {
      position: absolute;
      left: 50%;
      top: 700px;
      width: 620px;
      height: 620px;
      margin: -310px 0 0 -310px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(166, 122, 15, 0.55) 0%, rgba(166, 122, 15, 0.22) 45%, rgba(166, 122, 15, 0) 72%);
      opacity: 0;
      z-index: 1;
      transform: scale(0.85);
    }
    #pc04-hero-wrap {
      position: absolute;
      left: 50%;
      top: 700px;
      width: 594px;
      height: 594px;
      margin: -297px 0 0 -297px;
      z-index: 2;
      opacity: 0;
      transform: scale(0.88);
    }
    #pc04-hero-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* studio-floor hairline beneath the product */
    #pc04-floor-layer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 500px;
      pointer-events: none;
    }
    #pc04-floor-line {
      width: 460px;
      height: 1px;
      background: #C9A227;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: 50% 50%;
    }
  </style>

  <!-- Layer 0: full-bleed studio-white ground -->
  <div class="clip" id="pc04-ground" data-start="0" data-duration="3.5" data-track-index="0"></div>

  <!-- Layer 1: compass ring atmosphere -->
  <div class="clip" id="pc04-ring-layer" data-start="0" data-duration="3.5" data-track-index="1">
    <div id="pc04-ring"></div>
  </div>

  <!-- Layer 2: studio-floor hairline -->
  <div class="clip" id="pc04-floor-layer" data-start="0" data-duration="3.5" data-track-index="2">
    <div id="pc04-floor-line"></div>
  </div>

  <!-- Layer 3: hero glow + product (scale-swap settle into the held climax) -->
  <div class="clip" id="pc04-stage" data-start="0" data-duration="3.5" data-track-index="3">
    <div id="pc04-bloom-glow"></div>
    <div id="pc04-hero-wrap">
      <img id="pc04-hero-img" src="assets/images/product-04.jpeg" alt="">
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.0s): scale-swap settle ──────────────────────────
      // Arrival lands settled at the tail of the zoom-through harness
      // transition already carrying the box in from Frame 3 — this is the
      // "incoming" half of scale-swap-transition only, kept restrained
      // (soft back.out, no extra motion layered on top).
      tl.fromTo(
        "#pc04-hero-wrap",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.25)" },
        0.05
      );

      // Ground + ring settle in alongside the hero, same beat.
      tl.fromTo("#pc04-ground", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      tl.fromTo("#pc04-ring", { opacity: 0 }, { opacity: 0.28, duration: 0.8, ease: "power2.out" }, 0.05);

      // Studio-floor hairline draws in under the settling product.
      tl.fromTo(
        "#pc04-floor-line",
        { opacity: 0, scaleX: 0 },
        { opacity: 0.5, scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.35
      );

      // Ambient glow bloom — lands on the hero's settle (~0.7s), ONE beat.
      tl.fromTo(
        "#pc04-bloom-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.28, scale: 1, duration: 0.7, ease: "power2.out" },
        0
      );

      // ── Scene 2 (1.0–3.0s): held climax ─────────────────────────────────
      // The deliberate "perfect" hold — no push, no pan. Only a bounded
      // glow breathe and a hairline-subtle hero jitter, both finite
      // phase tweens (never a yoyo loop).
      var glow = document.getElementById("pc04-bloom-glow");
      var glowPhase = { p: 0 };
      tl.to(
        glowPhase,
        {
          p: Math.PI * 2 * 0.85,
          duration: 2.3,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(glowPhase.p);
            glow.style.opacity = String(0.28 + s * 0.035);
            glow.style.transform = "scale(" + (1 + s * 0.02) + ")";
          },
        },
        0.7
      );

      var hero = document.getElementById("pc04-hero-wrap");
      var jitterPhase = { p: 0 };
      tl.to(
        jitterPhase,
        {
          p: Math.PI * 2 * 3.1,
          duration: 2.3,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(jitterPhase.p);
            var c = Math.cos(jitterPhase.p * 0.7);
            hero.style.transform = "scale(1) translate(" + (c * 0.6) + "px, " + (s * 0.6) + "px)";
          },
        },
        0.7
      );

      window.__timelines["04-perfect-close"] = tl;
    })();
  </script>
</div>
</template>
