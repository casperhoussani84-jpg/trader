<template data-composition-id="03-fresh-lunch">
  <style>
    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      container-type: size;
      font-family: "Inter", sans-serif;
    }

    /* full-bleed ground — lives on a class="clip" layer, never on #root itself */
    .frame03-ground {
      position: absolute;
      inset: 0;
      background: #ffffff;
    }

    /* compass-drafted geo ring, atmosphere behind the hero (frame.md: 1-2 rings, 20-50% opacity) */
    .frame03-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96cqw;
      height: 96cqw;
      border-radius: 50%;
      border: 1px solid #c9a227;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.94);
    }
    .frame03-ring::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px dashed #c9a227;
      opacity: 0.7;
    }

    .frame03-bloom-stage {
      position: absolute;
      top: 30cqh;
      left: 50%;
      width: 74cqw;
      height: 74cqw;
      transform: translate(-50%, 0);
    }

    /* ambient-glow-bloom: behind layer, darker + more saturated than the hero surface */
    .frame03-bloom-glow {
      position: absolute;
      inset: -17cqw;
      z-index: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201, 162, 39, 0.55) 0%, rgba(232, 199, 102, 0.28) 42%, rgba(232, 199, 102, 0) 72%);
      opacity: 0;
      transform: scale(0.85);
    }

    .frame03-hero-jitter {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    .frame03-hero-frame {
      width: 100%;
      height: 100%;
      border: 1px solid #c9a227;
      overflow: hidden;
      background: #f3e7c0;
    }

    .frame03-hero-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(0.86);
    }
  </style>

  <div id="root" data-composition-id="03-fresh-lunch" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <div class="clip frame03-ground" data-start="0" data-duration="5" data-track-index="0"></div>

    <div class="clip frame03-ring" data-start="0" data-duration="5" data-track-index="1" id="frame03-ring"></div>

    <div class="clip frame03-bloom-stage" data-start="0" data-duration="5" data-track-index="2">
      <div class="frame03-bloom-glow" id="frame03-bloom-glow"></div>
      <div class="frame03-hero-jitter" id="frame03-hero-jitter">
        <div class="frame03-hero-frame">
          <img class="frame03-hero-img" id="frame03-hero-img" src="assets/images/product-03.webp" alt="" />
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.5s): calm, long-tail settle — the video's designated breather ──
      tl.fromTo(
        "#frame03-hero-img",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 1.35, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(
        "#frame03-ring",
        { opacity: 0, scale: 0.94 },
        { opacity: 0.28, scale: 1, duration: 1.35, ease: "power2.out" },
        0.1,
      );

      // ── Scene 2 (1.5–3.8s): ambient-glow-bloom behind the box — un-triggered, reads as daylight ──
      var BLOOM_START = 1.5;
      var BLOOM_DUR = 0.9;
      var GLOW_PEAK_OPACITY = 0.3;
      tl.fromTo(
        "#frame03-bloom-glow",
        { opacity: 0, scale: 0.85 },
        { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: "power2.out" },
        BLOOM_START,
      );

      // bounded idle breathe filling the rest of Scene 2 — finite phase tween, never a yoyo loop
      var glow = document.getElementById("frame03-bloom-glow");
      var breathePhase = { p: 0 };
      var BREATHE_START = BLOOM_START + BLOOM_DUR; // 2.4s
      var BREATHE_DUR = 1.4; // holds to 3.8s
      var OPACITY_AMP = 0.03;
      var SCALE_AMP = 0.015;
      tl.to(
        breathePhase,
        {
          p: Math.PI * 2 * 0.35,
          duration: BREATHE_DUR,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(breathePhase.p);
            glow.style.opacity = String(GLOW_PEAK_OPACITY + s * OPACITY_AMP);
            glow.style.transform = "scale(" + (1 + s * SCALE_AMP) + ")";
          },
        },
        BREATHE_START,
      );

      // ── Scene 3 (3.8–5.0s): hold the settled, lit frame — subtle jitter only ──
      var heroJitter = document.getElementById("frame03-hero-jitter");
      var jitterPhase = { p: 0 };
      tl.to(
        jitterPhase,
        {
          p: Math.PI * 2 * 0.6,
          duration: 1.2,
          ease: "none",
          onUpdate: function () {
            var x = Math.sin(jitterPhase.p) * 2.2;
            var y = Math.cos(jitterPhase.p * 1.3) * 1.6;
            heroJitter.style.transform = "translate(" + x.toFixed(2) + "px, " + y.toFixed(2) + "px)";
          },
        },
        3.8,
      );

      window.__timelines["03-fresh-lunch"] = tl;
    })();
  </script>
</template>
